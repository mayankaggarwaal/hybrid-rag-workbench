services:
  - type: web
    name: hybrid-rag-workbench
    runtime: docker
    plan: free
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: EMBEDDING_DIMENSION
        value: "384"
      - key: TOP_K
        value: "5"

